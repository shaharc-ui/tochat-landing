<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>תצוגה מקדימה · דף הבית המעוצב — ToChat Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0f; --card:#0d1017; --card-2:#0b0e14;
  --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.12);
  --emerald:#2ee6b6; --emerald-3:#5eead0; --emerald-soft:rgba(46,230,182,.12);
  --gold:#d4b87a; --gold-3:#e8d7ad; --gold-soft:rgba(212,184,122,.12);
  --rose:#f43f5e; --rose-soft:rgba(244,63,94,.12);
  --amber:#fbbf24;
  --t1:#f1f4f8; --t2:#8a95a8; --t3:#5b6678;
  --grid:rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  background:#080a0f;color:var(--t1);direction:rtl;line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;
  font-feature-settings:"tnum" 1,"lnum" 1;
}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 70% 45% at 50% -15%, rgba(46,230,182,.08), transparent 70%),
  radial-gradient(ellipse 50% 40% at 100% 0%, rgba(212,184,122,.06), transparent 70%),
  radial-gradient(ellipse 60% 50% at 0% 100%, rgba(56,189,248,.035), transparent 70%);}
.preview-tag{position:fixed;top:0;left:0;right:0;z-index:50;background:linear-gradient(90deg,#0a9070,#08b88a);
  color:#04140f;font-size:12.5px;font-weight:800;text-align:center;padding:6px;letter-spacing:.01em}
.app{position:relative;z-index:1;max-width:1536px;margin:0 auto;padding:42px clamp(14px,3vw,32px) 64px}
::selection{background:var(--emerald);color:#04140f}

.glass-card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--card);
  border:1px solid var(--border);border-radius:1.125rem;
  box-shadow:0 18px 50px -24px rgba(0,0,0,.8),inset 0 1px 0 0 rgba(255,255,255,.06)}
.glass-card.hover{transition:transform .25s cubic-bezier(.22,1,.36,1),border-color .25s}
.glass-card.hover:hover{transform:translateY(-2px);border-color:var(--border-2)}

/* page header */
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(22px,3vw,30px);font-weight:900;letter-spacing:-.025em;color:var(--t1);display:flex;align-items:center;gap:10px}
.gold-grad{background:linear-gradient(135deg,#e8d7ad,#d4b87a 60%,#b89a5e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pagehead .sub{font-size:13.5px;color:var(--t2);margin-top:4px}
.head-actions{display:flex;align-items:center;gap:8px}
.hbtn{height:38px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--border);border-radius:.75rem;color:var(--t2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.hbtn.icon{width:38px;justify-content:center;padding:0}
.hbtn svg{width:15px;height:15px}

/* summary header */
.sum-head{display:flex;align-items:center;gap:12px;margin:2px 2px 14px;flex-wrap:wrap}
.sum-ic{width:28px;height:28px;border-radius:.55rem;display:grid;place-items:center;background:var(--emerald-soft);border:1px solid rgba(46,230,182,.3)}
.sum-ic svg{width:15px;height:15px}
.sum-head h2{font-size:16px;font-weight:800;color:var(--t1)}
.sum-head .days{font-size:12px;color:var(--t3)}
.meta-chip{margin-inline-start:auto;display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--emerald);
  background:var(--emerald-soft);border:1px solid rgba(46,230,182,.25);border-radius:999px;padding:4px 11px}
.meta-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);animation:pulse 1.8s infinite}

/* kpi grid */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:15px 16px}
.kpi .top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.kpi .chip{width:28px;height:28px;border-radius:.55rem;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.kpi .chip svg{width:15px;height:15px}
.kpi .lbl{font-size:12px;font-weight:500;color:var(--t2)}
.kpi .mid{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kpi .val{font-size:25px;font-weight:900;letter-spacing:-.02em;line-height:1;color:var(--t1);white-space:nowrap}
.kpi .val.good{color:var(--emerald-3)}
.kpi .vsub{font-size:10.5px;color:var(--t3);margin-top:5px;height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.kpi .spark{width:92px;height:34px;flex:0 0 auto}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;margin-top:10px}
.delta.pos{color:var(--emerald);background:var(--emerald-soft)}
.delta.neg{color:var(--rose);background:var(--rose-soft)}
.delta.neu{color:var(--t2);background:rgba(255,255,255,.05)}

/* focus bar */
.focus{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:13px 15px;margin-bottom:16px}
.focus .ttl{font-size:13.5px;font-weight:800;color:var(--t2)}
.fbtn{padding:6px 12px;border-radius:.5rem;font-size:12px;font-weight:800;border:1px solid}
.fbtn.up{color:var(--emerald-3);background:var(--emerald-soft);border-color:rgba(46,230,182,.3)}
.fbtn.pause{color:#fcd34d;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3)}
.fbtn.kill{color:#fda4af;background:var(--rose-soft);border-color:rgba(244,63,94,.3)}
.tiers{display:flex;gap:14px;margin-inline-start:auto;font-size:12px;color:var(--t2);flex-wrap:wrap}
.tier{display:flex;align-items:center;gap:6px;font-weight:600}
.tier .d{width:8px;height:8px;border-radius:50%}

/* charts */
.charts{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.chart{padding:16px 16px 10px}
.chart .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.chart .ch h3{font-size:14px;font-weight:800;color:var(--t1)}
.chart .ch .tot{font-size:17px;font-weight:900;color:var(--t1)}
.chart .ch .tot small{font-size:11px;color:var(--t3);font-weight:600;margin-inline-start:5px}
.chart-wrap{direction:ltr}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.tt{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,0);background:rgba(13,16,23,.94);
  border:1px solid var(--border-2);border-radius:11px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--t1);
  white-space:nowrap;transition:opacity .12s;z-index:6;direction:rtl}
.tt.show{opacity:1}.tt b{color:var(--emerald-3)}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,230,182,.5)}70%{box-shadow:0 0 0 6px rgba(46,230,182,0)}100%{box-shadow:0 0 0 0 rgba(46,230,182,0)}}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.rise{opacity:0;animation:rise .5s cubic-bezier(.22,1,.36,1) forwards}

@media(max-width:1024px){.charts{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr);gap:10px}.kpi .val{font-size:21px}.kpi .spark{width:64px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="preview-tag">תצוגה מקדימה · מוקאפ של דף הבית המעוצב (נתונים לדוגמה) · אמרלד/זהב</div>
<div class="app">

  <!-- PAGE HEADER -->
  <header class="pagehead rise">
    <div>
      <h1>מודעות <span class="gold-grad">ToChat</span></h1>
      <div class="sub">42 מודעות · עודכן 12:48</div>
    </div>
    <div class="head-actions">
      <button class="hbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg> ToChat ראשי</button>
      <button class="hbtn icon" title="ייצוא"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
      <button class="hbtn icon" title="רענן"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg></button>
    </div>
  </header>

  <!-- SUMMARY HEADER -->
  <div class="sum-head rise" style="animation-delay:.05s">
    <span class="sum-ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6L12 2z" fill="#2ee6b6"/></svg></span>
    <h2>סיכום ביצועים</h2>
    <span class="days" id="days"></span>
    <span class="meta-chip"><span class="dot"></span> Meta Ads</span>
  </div>

  <!-- KPI GRID -->
  <section class="kpis" id="kpis"></section>

  <!-- FOCUS BAR -->
  <div class="focus glass-card rise" style="animation-delay:.18s">
    <span class="ttl">מוקד היום</span>
    <button class="fbtn up">🚀 הגדל 4</button>
    <button class="fbtn pause">⏸️ עצור 2</button>
    <button class="fbtn kill">💀 הרוג 1</button>
    <div class="tiers">
      <span class="tier"><span class="d" style="background:#a855f7"></span> 2 Super</span>
      <span class="tier"><span class="d" style="background:#2ee6b6"></span> 9 מנצחות</span>
      <span class="tier"><span class="d" style="background:#fbbf24"></span> 5 איזון</span>
      <span class="tier"><span class="d" style="background:#f43f5e"></span> 3 חלשות</span>
    </div>
  </div>

  <!-- CHARTS -->
  <section class="charts">
    <div class="chart glass-card rise" style="animation-delay:.24s">
      <div class="ch"><h3>הוצאה יומית</h3><div class="tot" id="spend-tot">—<small>סך התקופה</small></div></div>
      <div class="chart-wrap" id="area-wrap"></div>
    </div>
    <div class="chart glass-card rise" style="animation-delay:.3s">
      <div class="ch"><h3>לידים לפי יום</h3><div class="tot" id="leads-tot">—<small>לידים</small></div></div>
      <div class="chart-wrap" id="bar-wrap"></div>
    </div>
  </section>
</div>

<script>
/* ===== representative ToChat data (₪) ===== */
const CUR='₪', TARGET_CPL=55;
const daily=[ /* ~14 days: spent, leads */
 {d:'19/05',s:1040,l:7,imp:31200},{d:'20/05',s:1180,l:11,imp:34800},{d:'21/05',s:980,l:9,imp:29600},
 {d:'22/05',s:1260,l:14,imp:37100},{d:'23/05',s:1090,l:10,imp:32400},{d:'24/05',s:870,l:6,imp:26800},
 {d:'25/05',s:1320,l:13,imp:38900},{d:'26/05',s:1210,l:15,imp:35600},{d:'27/05',s:1150,l:12,imp:34100},
 {d:'28/05',s:1380,l:17,imp:40200},{d:'29/05',s:1240,l:14,imp:36800},{d:'30/05',s:1010,l:9,imp:30100},
 {d:'31/05',s:1290,l:13,imp:38400},{d:'01/06',s:1450,l:19,imp:42600}
];
const totalSpend=daily.reduce((a,b)=>a+b.s,0);
const totalLeads=daily.reduce((a,b)=>a+b.l,0);
const totalImpr=daily.reduce((a,b)=>a+b.imp,0);
const avgCPL=totalSpend/totalLeads;
const spentArr=daily.map(d=>d.s), leadsArr=daily.map(d=>d.l), imprArr=daily.map(d=>d.imp);
const cplArr=daily.map(d=>d.l>0?d.s/d.l:0);

const fmt=n=>new Intl.NumberFormat('en-US').format(Math.round(n));
const cur=(n,dec=0)=>CUR+new Intl.NumberFormat('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(n);
function halfTrend(a){if(a.length<4)return null;const m=Math.floor(a.length/2);const x=a.slice(0,m).reduce((s,v)=>s+v,0),y=a.slice(m).reduce((s,v)=>s+v,0);return x?((y-x)/x)*100:null;}
function cplTrend(sp,le){const m=Math.floor(sp.length/2);const sa=sp.slice(0,m).reduce((s,v)=>s+v,0),la=le.slice(0,m).reduce((s,v)=>s+v,0),sb=sp.slice(m).reduce((s,v)=>s+v,0),lb=le.slice(m).reduce((s,v)=>s+v,0);if(!la||!lb)return null;const ca=sa/la,cb=sb/lb;return ca?((cb-ca)/ca)*100:null;}

const EM='#2ee6b6',GD='#d4b87a',RS='#f43f5e';
function spark(values,color,id){
  if(values.length<2)return '';
  const w=92,h=34,p=3,mx=Math.max(...values),mn=Math.min(...values),rg=(mx-mn)||1;
  const pts=values.map((v,i)=>[p+i*(w-2*p)/(values.length-1),h-p-((v-mn)/rg)*(h-2*p)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.2" fill="${color}"/></svg>`;
}
function deltaPill(pct,{lower=false,neutral=false}={}){
  if(pct==null||!isFinite(pct))return '';
  const up=pct>=0;const good=neutral?null:(lower?!up:up);
  const cls=good===null?'neu':good?'pos':'neg';
  return `<span class="delta ${cls}" dir="ltr">${up?'▲':'▼'} ${Math.abs(pct).toFixed(1)}%</span>`;
}
const icons={
  spend:'<path d="M12 2v20M17 5.5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  leads:'<circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>',
  cpl:'<path d="M3 7l6 6 4-4 7 7"/><path d="M21 13v4h-4"/>',
  impr:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  deals:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  rev:'<circle cx="9" cy="9" r="6"/><path d="M21 15a6 6 0 0 1-9 5"/>',
  freq:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  act:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'
};
const cards=[
  {k:'spend',lbl:'הוצאה כוללת',val:cur(totalSpend),tint:GD,ic:icons.spend,spark:spentArr,sc:GD,delta:deltaPill(halfTrend(spentArr),{neutral:true})},
  {k:'leads',lbl:'לידים',val:fmt(totalLeads),tint:EM,ic:icons.leads,spark:leadsArr,sc:EM,sub:'18 מודעות פעילות',delta:deltaPill(halfTrend(leadsArr))},
  {k:'cpl',lbl:'CPL ממוצע',val:cur(avgCPL,1),good:avgCPL<=TARGET_CPL,tint:EM,ic:icons.cpl,spark:cplArr,sc:avgCPL<=TARGET_CPL?EM:RS,sub:'יעד '+cur(TARGET_CPL),delta:deltaPill(cplTrend(spentArr,leadsArr),{lower:true})},
  {k:'impr',lbl:'חשיפות',val:fmt(totalImpr),tint:EM,ic:icons.impr,spark:imprArr,sc:EM,sub:daily.length+' ימים',delta:deltaPill(halfTrend(imprArr))},
  {k:'deals',lbl:'עסקאות',val:'8',good:true,tint:EM,ic:icons.deals,sub:'CAC '+cur(1925)},
  {k:'rev',lbl:'הכנסות CRM',val:cur(96000),good:true,tint:GD,ic:icons.rev,sub:'ROAS 6.23x'},
  {k:'freq',lbl:'תדירות חשיפה',val:'2.34',tint:'#8a95a8',ic:icons.freq,sub:'חשיפות בממוצע לאדם'},
  {k:'act',lbl:'פעולות נדרשות',val:'7',tint:'#fbbf24',ic:icons.act,sub:'4 להגדיל · 3 לעצור'}
];

document.getElementById('days').textContent=daily.length+' ימים אחרונים';
document.getElementById('kpis').innerHTML=cards.map((c,i)=>`
  <article class="kpi glass-card hover rise" style="animation-delay:${0.08+i*0.03}s">
    <div class="top"><span class="chip" style="color:${c.tint}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.ic}</svg></span><span class="lbl">${c.lbl}</span></div>
    <div class="mid"><div><div class="val ${c.good?'good':''}">${c.val}</div>${c.sub?`<div class="vsub">${c.sub}</div>`:'<div class="vsub"></div>'}</div>${c.spark?spark(c.spark,c.sc,'sp'+c.k):''}</div>
    ${c.delta||''}
  </article>`).join('');

/* ===== area chart (daily spend) ===== */
function smooth(pts){let d=`M ${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;d+=` C ${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}return d;}
(function area(){
  const W=640,H=230,L=46,R=12,T=12,B=28,max=Math.max(...spentArr)*1.12;
  const x=i=>L+i*(W-L-R)/(daily.length-1), y=v=>T+(1-v/max)*(H-T-B);
  const pts=daily.map((d,i)=>[x(i),y(d.s)]);const line=smooth(pts);const fill=`${line} L${pts[pts.length-1][0]},${H-B} L${pts[0][0]},${H-B} Z`;
  let g='';for(let k=0;k<=3;k++){const gy=T+k*(H-T-B)/3;g+=`<line x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}" stroke="var(--grid)"/><text x="${L-6}" y="${gy+3}" fill="#5b6678" font-size="10" text-anchor="end" font-family="Heebo">${CUR}${fmt(max*(1-k/3))}</text>`;}
  let xl='';daily.forEach((d,i)=>{if(i%2===0)xl+=`<text x="${x(i)}" y="${H-9}" fill="#5b6678" font-size="10" text-anchor="middle" font-family="Heebo">${d.d}</text>`;});
  let dots='';daily.forEach((d,i)=>dots+=`<g class="hit" data-i="${i}"><circle cx="${x(i)}" cy="${y(d.s)}" r="10" fill="transparent"/><circle cx="${x(i)}" cy="${y(d.s)}" r="2.6" fill="#0d1017" stroke="#2ee6b6" stroke-width="2"/></g>`);
  document.getElementById('area-wrap').innerHTML=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ee6b6" stop-opacity=".4"/><stop offset="75%" stop-color="#2ee6b6" stop-opacity=".04"/><stop offset="100%" stop-color="#2ee6b6" stop-opacity="0"/></linearGradient></defs>${g}<path d="${fill}" fill="url(#af)"/><path d="${line}" fill="none" stroke="#2ee6b6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xl}</svg><div class="tt" id="att"></div>`;
  const wrap=document.getElementById('area-wrap'),tt=document.getElementById('att');
  wrap.querySelectorAll('.hit').forEach(el=>{el.onmouseenter=()=>{const i=+el.dataset.i,r=wrap.getBoundingClientRect();tt.innerHTML=`${daily[i].d} · <b>${cur(daily[i].s)}</b>`;tt.style.left=(x(i)/W*r.width)+'px';tt.style.top=(y(daily[i].s)/H*r.height-12)+'px';tt.classList.add('show');};el.onmouseleave=()=>tt.classList.remove('show');});
  document.getElementById('spend-tot').innerHTML=cur(totalSpend)+'<small>סך התקופה</small>';
})();

/* ===== bar chart (daily leads) ===== */
(function bars(){
  const W=520,H=230,L=30,R=10,T=12,B=28,max=Math.max(...leadsArr)*1.18;
  const step=(W-L-R)/daily.length, bw=Math.min(26,step*0.52);
  let g='';for(let k=0;k<=3;k++){const gy=T+k*(H-T-B)/3;g+=`<line x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}" stroke="var(--grid)"/><text x="${L-6}" y="${gy+3}" fill="#5b6678" font-size="10" text-anchor="end" font-family="Heebo">${Math.round(max*(1-k/3))}</text>`;}
  let rects='';daily.forEach((d,i)=>{const h=(d.l/max)*(H-T-B),bx=L+step*i+step/2-bw/2,by=H-B-h;rects+=`<g class="hit" data-i="${i}"><rect x="${bx-4}" y="${T}" width="${bw+8}" height="${H-B-T}" fill="transparent"/><rect x="${bx}" y="${by}" width="${bw}" height="${h}" rx="5" fill="url(#bf)"/>${i%2===0?`<text x="${bx+bw/2}" y="${H-9}" fill="#5b6678" font-size="10" text-anchor="middle" font-family="Heebo">${d.d}</text>`:''}</g>`;});
  document.getElementById('bar-wrap').innerHTML=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="bf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8d7ad"/><stop offset="100%" stop-color="#b89a5e"/></linearGradient></defs>${g}${rects}</svg><div class="tt" id="btt"></div>`;
  const wrap=document.getElementById('bar-wrap'),tt=document.getElementById('btt');
  wrap.querySelectorAll('.hit').forEach(el=>{el.onmouseenter=()=>{const i=+el.dataset.i,r=wrap.getBoundingClientRect();tt.innerHTML=`${daily[i].d} · <b>${daily[i].l} לידים</b>`;tt.style.left=((L+step*i+step/2)/W*r.width)+'px';tt.style.top='4px';tt.classList.add('show');};el.onmouseleave=()=>tt.classList.remove('show');});
  document.getElementById('leads-tot').innerHTML=fmt(totalLeads)+'<small>לידים</small>';
})();
</script>
</body>
